ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # --- 1. DỮ LIỆU TỪ BÁNH XE (WHEEL ENCODER) ---
    odom0: /diff_cont/odom
    # Cấu hình ma trận trạng thái:
    # [x,   y,   z,
    #  roll, pitch, yaw,
    #  vx,  vy,  vz,
    #  vroll, vpitch, vyaw,
    #  ax,  ay,  az]
    # Bánh xe chỉ đáng tin cậy ở vận tốc dài tiến tới (vx)
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # --- 2. DỮ LIỆU TỪ IMU (MPU6050) ---
    imu0: /imu/data
    # IMU skid-steer cần lấy vận tốc góc xoay quanh trục Z (vyaw) để triệt tiêu sai số trượt bánh
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true